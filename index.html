<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>한디원 AI 특강 · 강사 서보천</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#1c2434; --muted:#687385;
  --line:#dfe5ef; --primary:#1f4f9f; --primary2:#173b77;
  --accent:#e64646; --soft:#eef4ff; --ok:#178a57; --warn:#b56a00;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit}
.wrap{max-width:1440px;margin:auto;padding:20px}
.hero{background:linear-gradient(135deg,#173b77,#2b69c9);color:white;border-radius:22px;padding:24px;box-shadow:0 12px 35px rgba(31,79,159,.18)}
.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,42px)}
.hero .sub{opacity:.92;font-size:18px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.meta label{display:block;font-size:13px;opacity:.9;margin-bottom:6px}
.meta input{width:100%;padding:12px 13px;border:0;border-radius:12px;background:rgba(255,255,255,.95);color:#17233a}
.panel{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 20px rgba(34,50,80,.06)}
.panel h2{margin:0 0 12px;font-size:22px}
.timergrid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
.timerbox{background:#0f172a;color:#fff;border-radius:18px;padding:20px;text-align:center}
.clock{font-size:clamp(42px,8vw,82px);font-weight:800;letter-spacing:2px}
.timer-note{margin-top:6px;color:#c9d4e6}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.btn{border:0;border-radius:11px;padding:11px 16px;cursor:pointer;font-weight:700}
.btn.primary{background:#4f8cff;color:#fff}
.btn.ghost{background:#e9eef7;color:#26354f}
.btn.danger{background:#ffe8e8;color:#a72626}
.btn.add{background:#e9f8ef;color:#146c43}
.settings{display:grid;gap:10px;align-content:start}
.settings .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.settings input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}
.status{padding:11px 12px;border-radius:10px;background:#f6f8fc;color:#40506a;font-size:14px}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.legend{font-size:14px;color:var(--muted)}
.redhint{color:var(--accent);font-weight:800}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1050px}
th{background:#edf3ff;padding:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left}
th:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 0}
th:last-child{border-right:1px solid var(--line);border-radius:0 12px 0 0}
td{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;vertical-align:top;background:#fff}
td:last-child{border-right:1px solid var(--line)}
.thumb{width:100%;height:180px;border:2px dashed #cdd6e4;border-radius:12px;display:grid;place-items:center;background:#fafcff;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.filelabel{cursor:pointer;text-align:center;color:#5d6b82;font-size:14px;padding:12px}
.filelabel input{display:none}
.prompt{width:100%;min-height:180px;resize:vertical;border:1px solid #cfd8e6;border-radius:12px;padding:12px;line-height:1.55;background:#fff}
.prompt:focus{outline:3px solid #dbe8ff;border-color:#6d9ce7}
.copyrow{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.small{font-size:13px;color:var(--muted)}
.rowactions{display:flex;gap:6px;justify-content:flex-end}
.footer{margin:20px 0 8px;background:#173b77;color:#fff;padding:24px;border-radius:18px;text-align:center;font-size:20px;line-height:1.7}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:none}
@media(max-width:900px){
  .meta{grid-template-columns:1fr 1fr}
  .timergrid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .wrap{padding:10px}.meta{grid-template-columns:1fr}.hero{padding:18px}
}
@media print{
  .btn,.filelabel,.rowactions,.toast{display:none!important}
  body{background:white}.wrap{max-width:none;padding:0}.panel,.hero,.footer{box-shadow:none}
  .prompt{border:0;min-height:120px}.thumb{border:1px solid #bbb}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>한디원 AI 특강</h1>
    <div class="sub">강사 서보천</div>
    <div class="meta">
      <div><label>일자</label><input id="date" readonly></div>
      <div><label>장소</label><input id="place" placeholder="예: 한국디지털교육원 강의실"></div>
      <div><label>대상</label><input id="audience" placeholder="예: 중장년층 / 교직원 / 소상공인"></div>
      <div><label>강의 주제</label><input id="topic" placeholder="예: 생성형 AI 실전 활용"></div>
    </div>
  </section>

  <section class="panel">
    <h2>강의 진행 타이머</h2>
    <div class="timergrid">
      <div class="timerbox">
        <div id="clock" class="clock">00:00:00</div>
        <div id="timerNote" class="timer-note">강의 시간을 설정한 뒤 시작을 눌러주세요.</div>
        <div class="controls">
          <button class="btn primary" onclick="startTimer()">▶ 시작</button>
          <button class="btn ghost" onclick="pauseTimer()">⏸ 일시정지</button>
          <button class="btn ghost" onclick="resumeTimer()">▶ 계속</button>
          <button class="btn danger" onclick="resetTimer()">↺ 초기화</button>
          <button class="btn ghost" onclick="testBell()">🔔 종소리 테스트</button>
        </div>
      </div>
      <div class="settings">
        <div class="row">
          <div><label class="small">강의 시간(분)</label><input id="duration" type="number" min="15" max="480" value="120"></div>
          <div><label class="small">시작 시각(선택)</label><input id="startAt" type="time"></div>
        </div>
        <div class="status">🔔 알림 ① 시작 5분 후</div>
        <div class="status">🔔 알림 ② 종료 10분 전</div>
        <div class="status">🔔 알림 ③ 종료 5분 전</div>
        <div class="status" id="nextAlert">다음 알림: 대기 중</div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <div>
        <h2 style="margin-bottom:5px">AI 활용 프롬프트 실습</h2>
        <div class="legend">개인별로 바꿀 부분은 <span class="redhint">[이렇게 대괄호]</span>로 표시하세요.</div>
      </div>
      <button class="btn add" onclick="addPromptRow()">＋ 프롬프트 추가</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th style="width:22%">활용할 사진</th>
            <th style="width:50%">프롬프트</th>
            <th style="width:28%">생성 이미지·영상</th>
          </tr>
        </thead>
        <tbody id="promptBody"></tbody>
      </table>
    </div>
    <div class="small" style="margin-top:10px">기본 3개가 제공되며 최대 6개까지 추가할 수 있습니다. 입력 내용은 이 브라우저에 자동 저장됩니다.</div>
  </section>

  <div class="footer">
    수고 많으셨습니다.<br>
    다들 유용한 작품들 만들어서 활용하시기 바랍니다.
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const MAX_ROWS = 6;
let timer = null, endTime = null, pausedRemaining = null, startedAt = null;
let fired = {m5:false, before10:false, before5:false};

const defaults = [
`역할: 당신은 [20년 경력의 전문 디자이너]입니다.
맥락: [남성/여성], [연령대], [직업]을 대상으로 합니다.
과제: 첨부한 사진을 참고해 [원하는 이미지 스타일]로 만들어 주세요.
조건: [배경], [의상], [표정], [비율]을 적용하고 글자와 워터마크는 넣지 마세요.`,
`역할: 당신은 [AI 교육 전문 강사]입니다.
대상: [초등학생/중학생/성인/중장년층]
주제: [배우고 싶은 AI 주제]
과제: 초보자도 이해하기 쉽게 설명해 주세요.
형식: 핵심 설명 → 쉬운 예시 → 직접 해볼 실습 → 마무리 퀴즈 [3개]`,
`첨부한 사진의 핵심 인물과 분위기는 유지해 주세요.
[남자/여자] 인물의 [헤어스타일], [의상 색상], [표정]을 자연스럽게 표현하고,
배경은 [장소], 시간대는 [오전/오후/야간], 전체 느낌은 [따뜻함/고급스러움/역동적]으로 해 주세요.
결과물 비율은 [1:1/4:5/9:16/16:9]로 제작해 주세요.`
];

function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  const w=['일','월','화','수','목','금','토'][d.getDay()];
  return `${y}년 ${m}월 ${day}일 (${w})`;
}
date.value = fmtDate(new Date());

function saveMeta(){
  const data={place:place.value,audience:audience.value,topic:topic.value,duration:duration.value,startAt:startAt.value};
  localStorage.setItem('aiLectureMeta', JSON.stringify(data));
}
['place','audience','topic','duration','startAt'].forEach(id=>document.getElementById(id).addEventListener('input',saveMeta));
try{
  const s=JSON.parse(localStorage.getItem('aiLectureMeta')||'{}');
  Object.keys(s).forEach(k=>{if(document.getElementById(k)) document.getElementById(k).value=s[k]});
}catch(e){}

function makeRow(text=''){
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td>
      <div class="thumb source"><label class="filelabel">📷 활용 사진 넣기<input type="file" accept="image/*"></label></div>
    </td>
    <td>
      <textarea class="prompt" oninput="highlightHint(this); saveRows()">${escapeHtml(text)}</textarea>
      <div class="copyrow">
        <span class="small hint">[ ] 안의 내용을 개인에 맞게 변경</span>
        <div class="rowactions">
          <button class="btn ghost" onclick="copyPrompt(this)">📋 복사</button>
          <button class="btn danger" onclick="removeRow(this)">삭제</button>
        </div>
      </div>
    </td>
    <td>
      <div class="thumb result"><label class="filelabel">🖼️ 생성 이미지·영상 넣기<input type="file" accept="image/*,video/*"></label></div>
    </td>`;
  bindFile(tr.querySelector('.source input'), tr.querySelector('.source'));
  bindFile(tr.querySelector('.result input'), tr.querySelector('.result'));
  promptBody.appendChild(tr);
  updateDeleteButtons();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function addPromptRow(){
  if(promptBody.children.length>=MAX_ROWS){toast('프롬프트는 최대 6개까지 사용할 수 있습니다.');return;}
  makeRow('');
  saveRows();
}
function removeRow(btn){
  if(promptBody.children.length<=3){toast('기본 3개는 유지됩니다.');return;}
  btn.closest('tr').remove(); saveRows(); updateDeleteButtons();
}
function updateDeleteButtons(){
  [...document.querySelectorAll('.rowactions .danger')].forEach(b=>b.style.display=promptBody.children.length>3?'inline-block':'none');
}
function saveRows(){
  const arr=[...document.querySelectorAll('.prompt')].map(x=>x.value);
  localStorage.setItem('aiLecturePrompts',JSON.stringify(arr));
}
function loadRows(){
  let arr=null; try{arr=JSON.parse(localStorage.getItem('aiLecturePrompts')||'null')}catch(e){}
  (arr&&arr.length?arr:defaults).slice(0,MAX_ROWS).forEach(makeRow);
}
function bindFile(input,box){
  input.addEventListener('change',()=>{
    const f=input.files[0]; if(!f)return;
    const url=URL.createObjectURL(f);
    box.innerHTML='';
    if(f.type.startsWith('video/')){
      const v=document.createElement('video'); v.src=url; v.controls=true; v.style.cssText='width:100%;height:100%;object-fit:contain'; box.appendChild(v);
    } else {
      const img=document.createElement('img'); img.src=url; box.appendChild(img);
    }
  });
}
async function copyPrompt(btn){
  const text=btn.closest('td').querySelector('.prompt').value;
  try{await navigator.clipboard.writeText(text);toast('프롬프트를 복사했습니다. 카톡 등에 붙여넣기 하세요.')}
  catch(e){
    const ta=btn.closest('td').querySelector('.prompt'); ta.select(); document.execCommand('copy'); toast('프롬프트를 복사했습니다.');
  }
}
function highlightHint(){/* textarea 자체의 부분 색상은 지원되지 않아 안내 문구로 강조 */}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);
}

function bell(times=1){
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  const ctx=new C();
  for(let i=0;i<times;i++){
    const start=ctx.currentTime+i*.45;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,start); o.frequency.exponentialRampToValueAtTime(660,start+.35);
    g.gain.setValueAtTime(.001,start); g.gain.exponentialRampToValueAtTime(.25,start+.02); g.gain.exponentialRampToValueAtTime(.001,start+.4);
    o.connect(g); g.connect(ctx.destination); o.start(start); o.stop(start+.42);
  }
}
function testBell(){bell(2);toast('종소리 테스트')}
function startTimer(){
  resetTimer(false);
  const mins=Math.max(15,parseInt(duration.value||120));
  let start=new Date();
  if(startAt.value){
    const [h,m]=startAt.value.split(':').map(Number);
    const scheduled=new Date(); scheduled.setHours(h,m,0,0);
    if(scheduled>new Date()) start=scheduled;
  }
  startedAt=start.getTime(); endTime=startedAt+mins*60000; fired={m5:false,before10:false,before5:false};
  timer=setInterval(tick,500); tick(); bell(1); toast('강의 타이머를 시작했습니다.');
}
function pauseTimer(){
  if(!endTime)return;
  pausedRemaining=endTime-Date.now(); clearInterval(timer); timer=null;
  timerNote.textContent='일시정지 중'; toast('타이머를 일시정지했습니다.');
}
function resumeTimer(){
  if(pausedRemaining==null)return;
  endTime=Date.now()+pausedRemaining; startedAt=Date.now()-(parseInt(duration.value||120)*60000-pausedRemaining);
  pausedRemaining=null; timer=setInterval(tick,500); tick(); toast('타이머를 계속 진행합니다.');
}
function resetTimer(show=true){
  clearInterval(timer); timer=null; endTime=null; pausedRemaining=null; startedAt=null;
  clock.textContent='00:00:00'; timerNote.textContent='강의 시간을 설정한 뒤 시작을 눌러주세요.'; nextAlert.textContent='다음 알림: 대기 중';
  if(show) toast('타이머를 초기화했습니다.');
}
function tick(){
  if(!endTime)return;
  const now=Date.now();
  if(now<startedAt){
    const sec=Math.ceil((startedAt-now)/1000);
    clock.textContent='시작 대기'; timerNote.textContent=`설정 시각까지 ${Math.floor(sec/60)}분 ${sec%60}초`;
    return;
  }
  const total=parseInt(duration.value||120)*60000;
  const elapsed=now-startedAt, remain=Math.max(0,endTime-now);
  const h=Math.floor(remain/3600000), m=Math.floor((remain%3600000)/60000), s=Math.floor((remain%60000)/1000);
  clock.textContent=[h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
  timerNote.textContent=`진행 ${Math.floor(elapsed/60000)}분 · 남은 시간 ${Math.ceil(remain/60000)}분`;

  if(elapsed>=5*60000 && !fired.m5){fired.m5=true;bell(2);toast('🔔 강의 시작 5분이 지났습니다.');}
  if(remain<=10*60000 && remain>9*60000 && !fired.before10){fired.before10=true;bell(2);toast('🔔 강의 종료 10분 전입니다.');}
  if(remain<=5*60000 && remain>4*60000 && !fired.before5){fired.before5=true;bell(3);toast('🔔 강의 종료 5분 전입니다.');}
  if(!fired.m5) nextAlert.textContent='다음 알림: 시작 5분 후';
  else if(!fired.before10) nextAlert.textContent='다음 알림: 종료 10분 전';
  else if(!fired.before5) nextAlert.textContent='다음 알림: 종료 5분 전';
  else nextAlert.textContent='다음 알림: 강의 종료';
  if(remain<=0){clearInterval(timer);timer=null;clock.textContent='00:00:00';timerNote.textContent='강의가 종료되었습니다.';bell(4);toast('강의가 종료되었습니다. 수고 많으셨습니다!');}
}
loadRows();
</script>
</body>
</html>
